name: Release ForgeMail
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'
      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: install frontend dependencies
        run: npm install
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'ForgeMail v__VERSION__ — Stable Infrastructure'
          releaseBody: |
            **Recommended — portable (no install):** download **`ForgeMail_<version>_01_Windows_Portable.zip`** (sorts first in the asset list). Extract the folder, run `forgemail-desktop.exe`. The included `forgemail.portable` marker keeps your database in the `data` folder next to the app.

            **Installer:** use **`ForgeMail_<version>_x64-setup.exe`** if you prefer a classic install (helps bootstrap WebView2 on some PCs).

            **Changelog:** [CHANGELOG.md on GitHub](https://github.com/khayson/SMTP/blob/main/CHANGELOG.md) (same source as the in-app *What's New* tab).
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
      - name: Pack portable Windows ZIP
        shell: pwsh
        run: |
          $rel = "src-tauri/target/release"
          $exe = Join-Path $rel "forgemail-desktop.exe"
          if (-not (Test-Path $exe)) { Write-Error "Missing $exe — build step did not produce the app binary."; exit 1 }
          $tag = "${{ github.ref_name }}"
          $ver = $tag.TrimStart('v')
          # Prefix 01_ so this asset sorts before the NSIS setup exe in the GitHub UI list
          $zipName = "ForgeMail_${ver}_01_Windows_Portable.zip"
          $stageRoot = "portable-pkg/ForgeMail"
          New-Item -ItemType Directory -Force -Path $stageRoot | Out-Null
          Copy-Item $exe $stageRoot/
          Get-ChildItem $rel -File -Filter "*.dll" -ErrorAction SilentlyContinue | ForEach-Object { Copy-Item $_.FullName $stageRoot/ }
          if (Test-Path "$rel/resources") { Copy-Item "$rel/resources" "$stageRoot/resources" -Recurse }
          New-Item -ItemType File -Force -Path "$stageRoot/forgemail.portable" | Out-Null
          if (Test-Path $zipName) { Remove-Item $zipName -Force }
          Compress-Archive -Path "portable-pkg/ForgeMail" -DestinationPath $zipName
          Write-Host "Packed $zipName"
      - name: Upload portable ZIP to GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = $tag.TrimStart('v')
          $zipName = "ForgeMail_${ver}_01_Windows_Portable.zip"
          gh release upload $tag $zipName --clobber
